name: lakehouse-schema

instructions: ../prompts/01-lakehouse-schema-prompt.md

executor:
  harness: claude-sdk
  model: databricks-claude-sonnet-4-6
  auth:
    type: databricks
    profile: oss   # replace with your workspace's configured Omnigent profile

os_env: true        # needed for local file reads/writes and shell (DDL/DAB files)

policies:
  budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    on: [request]
    factory_params:
      max_cost_usd: 5.00
      ask_thresholds_usd: [3.00]
