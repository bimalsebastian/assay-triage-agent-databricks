name: sync-api

instructions: ../prompts/06-sync-api-prompt.md

executor:
  harness: claude-sdk
  model: databricks-claude-sonnet-4-6
  auth:
    type: databricks
    profile: oss   # replace with your workspace's configured Omnigent profile

os_env: true

policies:
  budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    on: [request]
    factory_params:
      max_cost_usd: 6.00
      ask_thresholds_usd: [4.00]

  # See ../policies/promotion-approval-gate.md — same caveat as the
  # orchestrator agent, since this endpoint can trigger promotion too.
  # gate_promotion:
  #   type: function
  #   handler: policies.gate_promotion.gate_promotion
  #   on: [tool_call]
