name: databricks-app-web

instructions: ../prompts/07-databricks-app-web-prompt.md

executor:
  harness: claude-sdk
  model: databricks-claude-sonnet-4-6
  auth:
    type: databricks
    profile: oss   # replace with your workspace's configured Omnigent profile

os_env: true

policies:
  budget:
    type: function
    handler: omnigent.policies.builtins.cost.cost_budget
    on: [request]
    factory_params:
      max_cost_usd: 6.00
      ask_thresholds_usd: [4.00]
